<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>-</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline controls>
        <source src="https://files.catbox.moe/27ohnq.mp4" type="video/mp4">
    </video>
    <script>
        const video = document.getElementById('v');
        // Sesli otomatik oynatma engeline takılmamak için tıklama tetikleyicisi
        document.body.addEventListener('click', () => {
            video.play();
        }, { once: true });
    </script>
</body>
</html>
